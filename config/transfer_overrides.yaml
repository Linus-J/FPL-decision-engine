# Two tiers of human judgement about who plays, both hand-edited.
#
# The minutes model projects from a player's own history, so a signing carries
# his previous club's status wholesale — Anderson arrived at Manchester City on
# 37 Nottingham Forest starts and was handed start_probability 0.97 with no
# Manchester City minutes anywhere in evidence. Neither tier is a blanket
# new-signing rule, which was measured and rejected: across 1,149
# player-seasons, prior-season regulars who changed club retained 95.6-97.2% of
# the minutes share stayers retained. Competition for a place is specific, so
# it is entered per player, with a reason and a date.

# Hard vetoes. The player is removed from the candidate pool entirely and can
# never be selected, however good the numbers look; if he is already owned, he
# is force-sold on the same terms as a confirmed departure.
#
# Distinct from `rotation_risk` below, which only DISCOUNTS. A cap leaves the
# optimiser free to decide the player is worth it anyway, and on the live GW1
# frame two of five capped players were selected regardless. Use `exclude` when
# the judgement is not up for negotiation.
exclude:

# Soft ceilings on start probability, for a contested place the minutes model
# cannot see. Empty for now: every entry the user asked for is a hard veto
# above. Kept because the tier is the right one for a genuine doubt, and the
# mechanism is tested.
rotation_risk:
# Gibbs-White's 0.75 cap REMOVED 2026-09-02. The doubt it encoded was wrong:
# he started and played 90 minutes in both GW1 and GW2, scoring 13 in GW2,
# and FPL has carried status=a / chance_of_playing=100 throughout. The cap
# was still discounting him across the whole GW3-GW7 horizon.
#
# Worth remembering why it was entered: the FPL app showed a knee doubt the
# public API never carried. That asymmetry is real, but a hand-entered cap has
# no expiry -- it kept applying for two gameweeks after the player had
# demonstrably answered the question on the pitch. Re-enter only with a date
# to review it by.

# Ceilings on start probability, for places the minutes model cannot see are
# contested. It projects minutes from a player's own history, so a signing
# carries his previous club's status wholesale — Anderson arrived at Manchester
# City on 37 Nottingham Forest starts and was handed start_probability 0.97
# with no Manchester City minutes anywhere in evidence.
#
# A cap only ever LOWERS: if the model already rates a player below the ceiling
# it is left alone, so an entry here can never talk the engine into a player.
#
# These numbers are judgement, not measurement — edit them freely. What is
# measured is that a blanket new-signing discount would be WRONG: across 1,149
# player-seasons, prior-season regulars who changed club retained 95.6-97.2% of
# the minutes share stayers retained. Competition for a place is specific, so
# it is entered by hand, per player, with a reason and a date.
rotation_risk:
- code: 215379          # Elliot Anderson, Man City (NB: not the Newcastle one, 232820)
  start_probability: 0.70
  reason: >-
    Summer signing with zero Manchester City minutes on record; 37 starts for
    Nottingham Forest in 25/26 are all the model has, and it reads them as 0.97.
    Took Stones' vacated No.5 and appears in published predicted XIs, so the
    cap is a discount rather than a write-off.
  as_of: '2026-08-18'
  source: 'user, BBC FPL preview'
- code: 209036          # Marc Guéhi, Man City
  start_probability: 0.85
  reason: >-
    BBC preview flags competition with Dias and Gvardiol. Our own data pushes
    back: 15 appearances for City after the January move, every one of them
    60+ minutes. Capped mildly to reflect the doubt without ignoring the record.
  as_of: '2026-08-18'
  source: 'user, BBC FPL preview'
- code: 221466          # Marcos Senesi, Spurs
  start_probability: 0.70
  reason: >-
    Summer move to Spurs after 37 Bournemouth appearances; centre-back depth
    and uncertainty over De Zerbi's shape. Not currently selected, so this is
    pre-emptive.
  as_of: '2026-08-18'
  source: 'user, BBC FPL preview'

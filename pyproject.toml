[project]
name = "fpl-bot"
version = "0.1.0"
description = "Autonomous FPL manager bot for 2026/27 season"
requires-python = ">=3.12"
dependencies = [
    # FPL & football data
    "fpl>=0.6.35",
    # understat lib is incompatible with aiohttp>=3.9; native scraper used instead
    # HTTP & scraping
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    # Data processing
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.4.0",
    # Optimisation
    "PuLP>=2.8.0",
    # Database
    "SQLAlchemy>=2.0.0",
    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    # Scheduling
    "APScheduler>=3.10.0",
    # Alerts
    "python-telegram-bot>=21.0.0",
    # Utilities
    "tenacity>=8.3.0",
    "rich>=13.7.0",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
]

[project.optional-dependencies]
# FBref event ingest (T5b). Heavy: soccerdata pulls a SeleniumBase/Chrome stack
# to bypass FBref's Cloudflare wall, so it is NOT a core dependency — only the
# optional data/ingestors/fbref.py adapter needs it, and only where a browser
# is available. The BPS recompute pipeline itself has no soccerdata dependency.
events = [
    "soccerdata>=1.9.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
fpl-bot = "scheduler.jobs:main"
fpl-backfill = "scripts.backfill_history:main"
fpl-train = "scripts.train_models:main"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
